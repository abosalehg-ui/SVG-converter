version: 2

# Updates are batched: one PR per group per month, so they never pile up and
# go stale against main. Majors are split out because they are the ones that
# can break the build. Security fixes (e.g. for Pillow) still arrive
# immediately through Dependabot security updates, which ignore this schedule.
updates:
  # Pillow decodes untrusted image files — it is the highest-risk dependency in
  # the project and must not drift behind security releases.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]

  # Playwright, used only by the end-to-end tests (the app has no npm deps).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]

  # Keeps the SHA-pinned actions in .github/workflows current; without this,
  # pinning would just freeze them on an ageing version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
