name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      # Actions are pinned to commit SHAs (not moving tags) so a compromised
      # tag cannot silently change what runs in CI. Dependabot keeps them fresh.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: >
          pytest -v
          --cov=svg_core --cov=svg_converter --cov=potrace_adapter
          --cov-report=term-missing

      # svg_core.py is the algorithm and is fully testable, so it is gated
      # hard. svg_converter.py is mostly Tk widget construction that needs a
      # display, and potrace_adapter.py needs a C extension CI does not build —
      # those are reported for visibility but not gated, rather than pretending
      # a low global number is a pass.
      - name: Enforce svg_core.py coverage
        run: coverage report --include=svg_core.py --fail-under=95

      - name: Report coverage of the remaining modules
        run: coverage report --include=svg_converter.py,potrace_adapter.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      # No `|| true`, and the whole tree — svg_converter.py used to be excluded,
      # which is why a NameError that broke every error dialog shipped green.
      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Smoke-check svg-core.js loads
        run: node -e "const s = require('./svg-core.js'); if (typeof s.createSVG !== 'function') process.exit(1);"

      - name: Syntax-check the browser scripts
        run: |
          for f in app.js theme-init.js svg-worker.js svg-core.js; do
            node --check "$f"
          done

      # Explicit file list: `node --test <dir>` is not supported on Node 18.
      - name: Run node:test suite
        run: node --test tests/svg-core.test.js tests/parity.test.js

  parity:
    name: Cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Both suites already assert against the goldens; regenerating proves the
      # committed fixtures are what Python actually produces, so a stale golden
      # can't let the two sides agree on the wrong answer.
      - name: Regenerate goldens and fail on any diff
        run: |
          python tests/fixtures/generate_golden.py
          git diff --exit-code tests/fixtures/

      - name: Assert JavaScript matches the same goldens
        run: node --test tests/parity.test.js
